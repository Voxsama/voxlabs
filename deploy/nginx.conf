# nginx reverse proxy with HTTPS. Put in /etc/nginx/sites-available/ and enable.
# Replace studio.example.com and the certificate paths.
server {
    listen 80;
    server_name studio.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name studio.example.com;

    ssl_certificate     /etc/ssl/certs/studio.crt;
    ssl_certificate_key /etc/ssl/private/studio.key;

    # Voice clips and bulk chapter imports
    client_max_body_size 200m;
    # Large project exports and long generations
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Live generation progress (Server-Sent Events): must not be buffered
    location ~ ^/api/projects/[^/]+/events$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
